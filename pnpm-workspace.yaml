packages:
  - apps/*
  - packages/*
  - scripts

allowBuilds:
  electron: true
  # Native. Its prebuild is what gives SSM sessions a real window size; the
  # exec layer falls back to plain pipes if it will not load.
  node-pty: true
  # Windows installer toolchain; its postinstall is irrelevant here.
  electron-winstaller: false
  esbuild: true

catalog:
  "@aws-sdk/client-cloudwatch": ^3.700.0
  "@aws-sdk/client-cloudwatch-logs": ^3.700.0
  "@aws-sdk/client-ec2": ^3.700.0
  "@aws-sdk/client-ec2-instance-connect": ^3.700.0
  "@aws-sdk/client-ecs": ^3.700.0
  "@aws-sdk/client-s3": ^3.700.0
  "@aws-sdk/client-ssm": ^3.700.0
  "@aws-sdk/client-sts": ^3.700.0
  "@aws-sdk/credential-providers": ^3.700.0
  "@aws-sdk/s3-request-presigner": ^3.700.0
  "@smithy/shared-ini-file-loader": ^4.0.4
  node-pty: ^1.1.0-beta21
  "@types/node": ^24.10.13
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vitest: ^5.0.0
