packages:
  - apps/*
  - packages/*
  - packages/providers/*
  - packages/providers/*/manifest
  - scripts

allowBuilds:
  # ssh2 and its optional cpu-features speedup both build native code. The pure
  # JS path is the supported one and keeps the build hermetic.
  cpu-features: false
  ssh2: false
  electron: true
  # Native. Its prebuild is what gives SSM sessions a real window size; the
  # exec layer falls back to plain pipes if it will not load.
  node-pty: true
  # Windows installer toolchain; its postinstall is irrelevant here.
  electron-winstaller: false
  esbuild: true
  # Its postinstall only double-checks the platform binary, which arrives as an
  # optional dependency either way. Used by dependency-cruiser, never shipped.
  "@swc/core": false

# Every external dependency is declared here once and referenced as
# `catalog:` or `catalog:<family>`; scripts/check-catalog.mjs fails CI on
# anything else. Families that must move together get a named catalog.
catalogMode: strict
cleanupUnusedCatalogs: true

