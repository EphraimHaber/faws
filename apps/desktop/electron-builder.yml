appId: net.cloudburst.faws
productName: faws
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# The app ships a pre-bundled server (apps/server/dist/main.mjs) and the built
# SPA (apps/web/dist) as extraResources; main.ts resolves both from
# process.resourcesPath.
files:
  - dist-electron/**
  - package.json
  - "!**/.DS_Store"
  - "!**/*.map"
  - "!**/*.ts"

extraResources:
  - from: ../server/dist
    to: server
    filter: ["**/*", "!**/*.map"]
  - from: ../web/dist
    to: web
    filter: ["**/*", "!**/*.map"]

# Where releases are published and where the in-app update check looks.
publish:
  provider: github
  owner: EphraimHaber
  repo: faws
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # The zip is what the update check reads its metadata beside; the dmg is
  # what people download. Unsigned, so the arm64 build is ad-hoc signed by
  # default and the first launch needs right-click > Open.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# The server is pre-bundled, and its one native module (node-pty) is staged
# prebuilt by apps/server/scripts/stage-native.mjs into the server's own
# folder, which ships as an extra resource; electron-builder has nothing to
# rebuild.
nodeGypRebuild: false
